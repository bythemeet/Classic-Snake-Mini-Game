<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retro Snake Game - Wine Theme</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            background: linear-gradient(135deg, #3a151d, #6b2d3c, #2a0f14);
            color: #f4f1ea;
            font-family: 'Georgia', Times, serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .card {
            background: rgba(74, 29, 39, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 2rem;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            text-align: center;
            backdrop-filter: blur(10px);
        }

        h1 {
            margin-top: 0;
            font-size: 1.8rem;
            color: #ffffff;
            margin-bottom: 0.5rem;
        }

        .score-board {
            font-size: 1.2rem;
            margin-bottom: 1rem;
            color: #d4a373;
            font-weight: bold;
        }

        canvas {
            background-color: #1a080c;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 8px;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.8);
        }

        .instructions {
            margin-top: 1rem;
            font-size: 0.9rem;
            color: #e3dcd2;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>Classic Snake Game</h1>
        <div class="score-board">Score: <span id="score">0</span></div>
        
        <!-- Game Canvas -->
        <canvas id="snakeBoard" width="400" height="400"></canvas>
        
        <div class="instructions">
            Use <b>Arrow Keys</b> to play!
        </div>
    </div>

    <script>
        const canvas = document.getElementById("snakeBoard");
        const ctx = canvas.getContext("2d");

        const gridSize = 20;
        const tileCount = canvas.width / gridSize;

        let snake = [
            { x: 10, y: 10 },
            { x: 9, y: 10 },
            { x: 8, y: 10 }
        ];
        let food = { x: 5, y: 5 };
        let dx = 1;
        let dy = 0;
        let score = 0;
        let changingDirection = false;

        // Listen for keyboard arrow keys
        document.addEventListener("keydown", changeDirection);

        let gameInterval = setInterval(main, 100);

        function main() {
            if (hasGameEnded()) {
                alert("Game Over! Score: " + score);
                document.location.reload();
                return;
            }

            changingDirection = false;
            clearCanvas();
            drawFood();
            moveSnake();
            drawSnake();
        }

        function clearCanvas() {
            ctx.fillStyle = "#1a080c";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        }

        function drawSnake() {
            snake.forEach((part, index) => {
                ctx.fillStyle = index === 0 ? "#d4a373" : "#00ffcc"; // Head is gold, body is cyan
                ctx.fillRect(part.x * gridSize, part.y * gridSize, gridSize - 2, gridSize - 2);
            });
        }

        function moveSnake() {
            const head = { x: snake[0].x + dx, y: snake[0].y + dy };
            snake.unshift(head);

            const hasEatenFood = snake[0].x === food.x && snake[0].y === food.y;
            if (hasEatenFood) {
                score += 10;
                document.getElementById("score").innerText = score;
                generateFood();
            } else {
                snake.pop();
            }
        }

        function generateFood() {
            food.x = Math.floor(Math.random() * tileCount);
            food.y = Math.floor(Math.random() * tileCount);

            snake.forEach(part => {
                const hasEaten = part.x === food.x && part.y === food.y;
                if (hasEaten) generateFood();
            });
        }

        function drawFood() {
            ctx.fillStyle = "#ff4d4d"; // Red food
            ctx.fillRect(food.x * gridSize, food.y * gridSize, gridSize - 2, gridSize - 2);
        }

        function changeDirection(event) {
            const keyPressed = event.keyCode;
            const LEFT = 37;
            const UP = 38;
            const RIGHT = 39;
            const DOWN = 40;

            if (changingDirection) return;

            if (keyPressed === LEFT && dx === 0) { dx = -1; dy = 0; changingDirection = true; }
            if (keyPressed === UP && dy === 0) { dx = 0; dy = -1; changingDirection = true; }
            if (keyPressed === RIGHT && dx === 0) { dx = 1; dy = 0; changingDirection = true; }
            if (keyPressed === DOWN && dy === 0) { dx = 0; dy = 1; changingDirection = true; }
        }

        function hasGameEnded() {
            for (let i = 4; i < snake.length; i++) {
                if (snake[i].x === snake[0].x && snake[i].y === snake[0].y) return true;
            }
            const hitLeftWall = snake[0].x < 0;
            const hitRightWall = snake[0].x >= tileCount;
            const hitToptWall = snake[0].y < 0;
            const hitBottomWall = snake[0].y >= tileCount;
            return hitLeftWall || hitRightWall || hitToptWall || hitBottomWall;
        }

        generateFood();
    </script>
</body>
</html>
